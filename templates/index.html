<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinUni AI Lab 7 - Embedding & Vector Store</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* CSS SYSTEM DESIGN SYSTEM FOR LAB 7 */
    :root {
      --bg-main: #090d16;
      --bg-card: rgba(17, 25, 40, 0.75);
      --border-card: rgba(255, 255, 255, 0.08);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --accent-teal: #14b8a6;
      --accent-purple: #a855f7;
      --error: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(20, 184, 166, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.05) 0%, transparent 50%);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Container Glassmorphism */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .app-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-height: 100vh;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .logo-title h1 {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #c7d2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-title p {
      font-size: 0.75rem;
      color: var(--text-secondary);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .provider-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }

    .provider-selector label {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .provider-selector select {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Main layout with Sidebar and Content */
    .main-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 24px;
      flex: 1;
    }

    /* Navigation Sidebar */
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      height: fit-content;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.05));
      color: var(--text-primary);
      border-color: rgba(99, 102, 241, 0.25);
      box-shadow: inset 0 0 12px rgba(99, 102, 241, 0.05);
    }

    .nav-item i {
      font-size: 1.15rem;
    }

    /* Content Area */
    .content-area {
      padding: 24px;
      min-height: 500px;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    textarea, input[type="text"], input[type="number"], select {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      color: var(--text-primary);
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
    }

    textarea:focus, input[type="text"]:focus, input[type="number"]:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 8px rgba(99, 102, 241, 0.25);
    }

    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .slider-header span.value {
      color: var(--primary);
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 0 8px var(--primary);
      transition: transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.5);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Tab Layouts */
    .tab-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tab-description {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    /* Chunking Tab Specifics */
    .chunking-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
    }

    .chunking-results {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .strategy-card {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .strategy-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 12px;
    }

    .strategy-name {
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .strategy-stats {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
    }

    .stat-pill strong {
      color: var(--text-primary);
    }

    .chunks-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chunk-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      line-height: 1.5;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .chunk-box:hover {
      background: rgba(255, 255, 255, 0.02);
      border-color: var(--primary);
    }

    .chunk-index {
      font-weight: 700;
      color: var(--primary);
      margin-right: 6px;
    }

    /* Similarity Tab Specifics */
    .similarity-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .similarity-left {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .similarity-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 24px;
      text-align: center;
    }

    .gauge-container {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gauge-circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(17, 25, 40, 0.9) 0%, rgba(9, 13, 22, 0.9) 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 4px solid rgba(255, 255, 255, 0.05);
      z-index: 2;
    }

    .gauge-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: var(--primary);
      filter: blur(25px);
      opacity: 0.15;
      z-index: 1;
      transition: all 0.5s ease;
    }

    .gauge-value {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, #c7d2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gauge-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .vector-preview-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: left;
    }

    .vector-preview-box h4 {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .vector-array {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--accent-teal);
      word-break: break-all;
    }

    /* Vector Store Tab Specifics */
    .vector-layout {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 24px;
    }

    .document-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }

    .doc-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .doc-info h5 {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .doc-info p {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    /* Metadata Tag Creator */
    .meta-inputs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .meta-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.25);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #c7d2fe;
    }

    .meta-tag button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .meta-tag button:hover {
      color: var(--error);
    }

    .search-results-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .result-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .result-card:hover {
      border-color: rgba(99, 102, 241, 0.3);
      transform: translateY(-1px);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .result-id {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--primary);
    }

    .result-score {
      font-size: 0.8rem;
      background: rgba(20, 184, 166, 0.15);
      color: var(--accent-teal);
      border: 1px solid rgba(20, 184, 166, 0.25);
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
    }

    .result-content {
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .result-meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .meta-pill {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 4px;
      color: var(--text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* RAG Agent Tab Specifics */
    .agent-layout {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .agent-chat-card {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .agent-response-area {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px;
      min-height: 100px;
      position: relative;
    }

    .agent-response-placeholder {
      color: var(--text-secondary);
      font-style: italic;
    }

    .agent-sources-area {
      margin-top: 16px;
    }

    .agent-sources-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Loading Spinner */
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Dashboard Tab */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    .dashboard-card {
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .dashboard-card-icon {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .card-purple {
      background: rgba(168, 85, 247, 0.1);
      border-color: rgba(168, 85, 247, 0.2);
    }
    .card-purple i {
      color: var(--accent-purple);
    }

    .card-teal {
      background: rgba(20, 184, 166, 0.1);
      border-color: rgba(20, 184, 166, 0.2);
    }
    .card-teal i {
      color: var(--accent-teal);
    }

    .card-indigo {
      background: rgba(99, 102, 241, 0.1);
      border-color: rgba(99, 102, 241, 0.2);
    }
    .card-indigo i {
      color: var(--primary);
    }

    .dashboard-card-info h3 {
      font-size: 1.8rem;
      font-weight: 800;
    }

    .dashboard-card-info p {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .intro-box {
      padding: 24px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .intro-box p {
      margin-bottom: 12px;
      color: var(--text-secondary);
    }

    .intro-box strong {
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Helper to render icons using Lucide safely in React
    const Icon = ({ name, className = "" }) => {
      const spanRef = React.useRef(null);
      useEffect(() => {
        if (spanRef.current && window.lucide) {
          // Inject <i> tag manually so React doesn't track it
          spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: spanRef.current });
        }
      }, [name, className]);
      return <span ref={spanRef} style={{ display: "inline-flex", alignItems: "center", justifyContent: "center" }}></span>;
    };

    function App() {
      const [activeTab, setActiveTab] = useState("dashboard");
      const [provider, setProvider] = useState("local");
      const [storeSize, setStoreSize] = useState(0);

      // Fetch vector store size from backend
      const fetchStoreSize = async () => {
        try {
          const res = await fetch("/api/store/size");
          const data = await res.json();
          setStoreSize(data.size || 0);
        } catch (e) {
          console.error("Lỗi lấy thông tin size store:", e);
        }
      };

      useEffect(() => {
        fetchStoreSize();
      }, []);

      const updateProvider = (e) => {
        setProvider(e.target.value);
      };

      return (
        <div className="app-container">
          <header className="glass-card">
            <div className="logo-container">
              <div className="logo-icon">
                <Icon name="database" />
              </div>
              <div className="logo-title">
                <h1>VinUni AI Lab 7</h1>
                <p>Embedding & Vector Store</p>
              </div>
            </div>
            <div className="provider-selector">
              <label htmlFor="provider-select">Embedding Provider:</label>
              <select id="provider-select" value={provider} onChange={updateProvider}>
                <option value="mock">Mock Embedder (MD5)</option>
                <option value="local">Local Embedder (all-MiniLM-L6)</option>
                <option value="openai">OpenAI (text-embedding-3-small)</option>
              </select>
            </div>
          </header>

          <div className="main-layout">
            <aside className="glass-card sidebar-nav">
              <div 
                className={`nav-item ${activeTab === "dashboard" ? "active" : ""}`}
                onClick={() => setActiveTab("dashboard")}
              >
                <Icon name="layout-dashboard" />
                Dashboard
              </div>
              <div 
                className={`nav-item ${activeTab === "chunking" ? "active" : ""}`}
                onClick={() => setActiveTab("chunking")}
              >
                <Icon name="scissors" />
                Chunking Playground
              </div>
              <div 
                className={`nav-item ${activeTab === "similarity" ? "active" : ""}`}
                onClick={() => setActiveTab("similarity")}
              >
                <Icon name="git-compare" />
                Similarity Playground
              </div>
              <div 
                className={`nav-item ${activeTab === "vectorstore" ? "active" : ""}`}
                onClick={() => setActiveTab("vectorstore")}
              >
                <Icon name="server" />
                Vector Store Manager
              </div>
              <div 
                className={`nav-item ${activeTab === "ragagent" ? "active" : ""}`}
                onClick={() => setActiveTab("ragagent")}
              >
                <Icon name="bot" />
                RAG Agent
              </div>
              <div 
                className={`nav-item ${activeTab === "benchmark" ? "active" : ""}`}
                onClick={() => setActiveTab("benchmark")}
              >
                <Icon name="gauge" />
                Benchmark Tool
              </div>
            </aside>

            <main className="glass-card content-area">
              {activeTab === "dashboard" && (
                <Dashboard 
                  storeSize={storeSize} 
                  provider={provider} 
                  setActiveTab={setActiveTab}
                />
              )}
              {activeTab === "chunking" && <ChunkingPlayground />}
              {activeTab === "similarity" && <SimilarityPlayground provider={provider} />}

    function ChunkingPlayground() {
      const [text, setText] = useState(
        "Artificial intelligence is transforming industries. Machine learning enables systems to learn from data.\n\nDeep learning uses neural networks with many layers. Natural language processing handles text understanding. Computer vision processes images and video streams."
      );
      const [chunkSize, setChunkSize] = useState(150);
      const [overlap, setOverlap] = useState(15);
      const [maxSentences, setMaxSentences] = useState(2);
      const [loading, setLoading] = useState(false);
      const [results, setResults] = useState(null);

      const handleChunking = async () => {
        setLoading(true);
        try {
          const res = await fetch("/api/chunk", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text,
              chunk_size: chunkSize,
              overlap,
              max_sentences_per_chunk: maxSentences
            })
          });
          const data = await res.json();
          setResults(data);
        } catch (e) {
          alert("Lỗi xử lý chunking: " + e.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="chunking-layout">
          <div className="chunking-inputs">
            <div className="tab-title">Cắt Nhỏ Văn Bản</div>
            <div className="tab-description">Nhập văn bản và cấu hình tham số để so sánh các chiến lược phân đoạn văn bản.</div>

            <div className="form-group">
              <label>Văn bản đầu vào:</label>
              <textarea 
                rows="8" 
                value={text} 
                onChange={(e) => setText(e.target.value)}
                placeholder="Nhập đoạn văn bản cần chunk vào đây..."
              />
            </div>

            <div className="slider-container">
              <div className="slider-header">
                <span>Chunk Size:</span>
                <span className="value">{chunkSize} ký tự</span>
              </div>
              <input 
                type="range" 
                min="50" 
                max="500" 
                step="10" 
                value={chunkSize} 
                onChange={(e) => setChunkSize(parseInt(e.target.value))}
              />
            </div>

            <div className="slider-container">
              <div className="slider-header">
                <span>Overlap Size:</span>
                <span className="value">{overlap} ký tự</span>
              </div>
              <input 
                type="range" 
                min="0" 
                max="100" 
                step="5" 
                value={overlap} 
                onChange={(e) => setOverlap(parseInt(e.target.value))}
              />
            </div>

            <div className="slider-container">
              <div className="slider-header">
                <span>Max Sentences Per Chunk (Sentence Chunker):</span>
                <span className="value">{maxSentences} câu</span>
              </div>
              <input 
                type="range" 
                min="1" 
                max="10" 
                step="1" 
                value={maxSentences} 
                onChange={(e) => setMaxSentences(parseInt(e.target.value))}
              />
            </div>

            <button className="btn btn-primary" onClick={handleChunking} disabled={loading} style={{width: "100%"}}>
              {loading ? <div className="spinner"></div> : <><Icon name="play" /> Cắt Chunk</>}
            </button>
          </div>

          <div className="chunking-results">
            {!results && (
              <div style={{display: "flex", flex: 1, alignItems: "center", justifyContent: "center", border: "1px dashed rgba(255,255,255,0.1)", borderRadius: "16px", minHeight: "350px", color: "var(--text-secondary)"}}>
                Nhấn "Cắt Chunk" để xem so sánh kết quả trực quan
              </div>
            )}

            {results && (
              <>
                {/* Fixed Size Card */}
                <div className="glass-card strategy-card">
                  <div className="strategy-header">
                    <div className="strategy-name" style={{color: "var(--primary)"}}>
                      <Icon name="layout" /> FixedSizeChunker
                    </div>
                    <div className="strategy-stats">
                      <span className="stat-pill">Số lượng: <strong>{results.fixed_size.count}</strong></span>
                      <span className="stat-pill">Độ dài TB: <strong>{results.fixed_size.avg_length} ký tự</strong></span>
                    </div>
                  </div>
                  <div className="chunks-grid">
                    {results.fixed_size.chunks.map((chunk, idx) => (
                      <div key={idx} className="chunk-box">
                        <span className="chunk-index">[{idx + 1}]</span>
                        {chunk}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Sentence Chunker Card */}
                <div className="glass-card strategy-card">
                  <div className="strategy-header">
                    <div className="strategy-name" style={{color: "var(--accent-teal)"}}>
                      <Icon name="align-left" /> SentenceChunker
                    </div>
                    <div className="strategy-stats">
                      <span className="stat-pill">Số lượng: <strong>{results.by_sentences.count}</strong></span>
                      <span className="stat-pill">Độ dài TB: <strong>{results.by_sentences.avg_length} ký tự</strong></span>
                    </div>
                  </div>
                  <div className="chunks-grid">
                    {results.by_sentences.chunks.map((chunk, idx) => (
                      <div key={idx} className="chunk-box">
                        <span className="chunk-index">[{idx + 1}]</span>
                        {chunk}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Recursive Chunker Card */}
                <div className="glass-card strategy-card">
                  <div className="strategy-header">
                    <div className="strategy-name" style={{color: "var(--accent-purple)"}}>
                      <Icon name="git-branch" /> RecursiveChunker
                    </div>
                    <div className="strategy-stats">
                      <span className="stat-pill">Số lượng: <strong>{results.recursive.count}</strong></span>
                      <span className="stat-pill">Độ dài TB: <strong>{results.recursive.avg_length} ký tự</strong></span>
                    </div>
                  </div>
                  <div className="chunks-grid">
                    {results.recursive.chunks.map((chunk, idx) => (
                      <div key={idx} className="chunk-box">
                        <span className="chunk-index">[{idx + 1}]</span>
                        {chunk}
                      </div>
                    ))}
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    function SimilarityPlayground({ provider }) {
      const [a, setA] = useState("The room is extremely hot.");
      const [b, setB] = useState("The room is freezing cold.");
      const [score, setScore] = useState(null);
      const [dimensions, setDimensions] = useState(null);
      const [vectorA, setVectorA] = useState([]);
      const [vectorB, setVectorB] = useState([]);
      const [loading, setLoading] = useState(false);

      const calculateSimilarity = async () => {
        setLoading(true);
        try {
          const res = await fetch("/api/similarity", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sentence_a: a, sentence_b: b, provider })
          });
          const data = await res.json();
          if (data.error) {
            alert(data.error);
          } else {
            setScore(data.similarity);
            setDimensions(data.dimensions);
            setVectorA(data.vector_a_preview);
            setVectorB(data.vector_b_preview);
          }
        } catch (e) {
          alert("Lỗi tính toán: " + e.message);
        } finally {
          setLoading(false);
        }
      };

      // Determine gauge color based on score
      const getGaugeColor = (val) => {
        if (val === null) return "var(--primary)";
        if (val < 0.2) return "#ef4444"; // red
        if (val < 0.5) return "#f59e0b"; // yellow
        return "#10b981"; // green
      };

      return (
        <div>
          <div className="tab-title">Sân Chơi Tính Độ Tương Đồng</div>
          <div className="tab-description">
            Nhập 2 câu để tính toán độ tương đồng Cosine ngữ nghĩa sử dụng <strong>{provider.toUpperCase()} Embedder</strong>.
          </div>

          <div className="similarity-layout">
            <div className="similarity-left">
              <div className="form-group">
                <label>Câu A (Sentence A):</label>
                <textarea 
                  rows="4" 
                  value={a} 
                  onChange={(e) => setA(e.target.value)}
                  placeholder="Nhập câu thứ nhất..."
                />
              </div>

              <div className="form-group">
                <label>Câu B (Sentence B):</label>
                <textarea 
                  rows="4" 
                  value={b} 
                  onChange={(e) => setB(e.target.value)}
                  placeholder="Nhập câu thứ hai..."
                />
              </div>

              <button className="btn btn-primary" onClick={calculateSimilarity} disabled={loading} style={{width: "100%"}}>
                {loading ? <div className="spinner"></div> : <><Icon name="percent" /> Tính Toán Tương Đồng</>}
              </button>
            </div>

            <div className="glass-card similarity-right">
              <h3>Độ Tương Đồng Cosine</h3>
              
              <div className="gauge-container">
                <div className="gauge-glow" style={{background: getGaugeColor(score), opacity: score !== null ? 0.25 : 0.1}}></div>
                <div className="gauge-circle" style={{borderColor: score !== null ? getGaugeColor(score) : "rgba(255,255,255,0.05)"}}>
                  <div className="gauge-value">{score !== null ? score.toFixed(4) : "—"}</div>
                  <div className="gauge-label">Similarity</div>
                </div>
              </div>

              {score !== null && (
                <div style={{width: "100%", display: "flex", flexDirection: "column", gap: "12px"}}>
                  <div className="vector-preview-box">
                    <h4>Mô tả Vector ({dimensions} dimensions):</h4>
                    <p style={{fontSize: "0.85rem", color: "var(--text-secondary)", marginBottom: "8px"}}>
                      Vector preview A (5 giá trị đầu):
                    </p>
                    <div className="vector-array">
                      [{vectorA.map(v => v.toFixed(5)).join(", ")}...]
                    </div>
                    <p style={{fontSize: "0.85rem", color: "var(--text-secondary)", marginTop: "12px", marginBottom: "8px"}}>
                      Vector preview B (5 giá trị đầu):
                    </p>
                    <div className="vector-array">
                      [{vectorB.map(v => v.toFixed(5)).join(", ")}...]
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function VectorStoreManager({ provider, storeSize, onStoreUpdate }) {
      const [docId, setDocId] = useState("");
      const [content, setContent] = useState("");
      const [metaKey, setMetaKey] = useState("");
      const [metaVal, setMetaVal] = useState("");
      const [metadata, setMetadata] = useState({});
      const [searchQuery, setSearchQuery] = useState("");
      const [filterKey, setFilterKey] = useState("");
      const [filterVal, setFilterVal] = useState("");
      const [searchResults, setSearchResults] = useState([]);
      const [loadingAdd, setLoadingAdd] = useState(false);
      const [loadingUpload, setLoadingUpload] = useState(false);
      const [loadingSearch, setLoadingSearch] = useState(false);
      const [selectedFile, setSelectedFile] = useState(null);

      const addMetadataTag = () => {
        if (metaKey.strip && !metaKey.strip()) return;
        if (metaKey && metaVal) {
          setMetadata(prev => ({ ...prev, [metaKey]: metaVal }));
          setMetaKey("");
          setMetaVal("");
        }
      };

      const removeMetadataTag = (key) => {
        setMetadata(prev => {
          const next = { ...prev };
          delete next[key];
          return next;
        });
      };

      const handleAddDocument = async () => {
        if (!content.trim()) return alert("Vui lòng điền nội dung document");
        setLoadingAdd(true);
        try {
          const finalId = docId.trim() || `doc_${Date.now()}`;
          const res = await fetch("/api/store/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              provider,
              documents: [{ id: finalId, content, metadata }]
            })
          });
          const data = await res.json();
          if (data.error) {
            alert(data.error);
          } else {
            alert("Đã thêm document thành công!");
            setDocId("");
            setContent("");
            setMetadata({});
            onStoreUpdate();
          }
        } catch (e) {
          alert("Lỗi thêm document: " + e.message);
        } finally {
          setLoadingAdd(false);
        }
      };

      const handleFileUpload = async () => {
        if (!selectedFile) return alert("Vui lòng chọn file PDF hoặc TXT");
        setLoadingUpload(true);
        const formData = new FormData();
        formData.append("file", selectedFile);
        formData.append("chunk_size", "500");

        try {
          const res = await fetch("/api/store/upload", {
            method: "POST",
            body: formData
          });
          const data = await res.json();
          if (data.error) {
            alert(data.error);
          } else {
            alert("Upload và Chunking thành công! " + data.message);
            setSelectedFile(null);
            document.getElementById("file-upload").value = "";
            onStoreUpdate();
          }
        } catch (e) {
          alert("Lỗi upload: " + e.message);
        } finally {
          setLoadingUpload(false);
        }
      };

      const handleSearch = async () => {
        if (!searchQuery.trim()) return alert("Vui lòng điền truy vấn tìm kiếm");
        setLoadingSearch(true);
        try {
          const filter = filterKey && filterVal ? { [filterKey]: filterVal } : null;
          const res = await fetch("/api/store/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: searchQuery, top_k: 5, metadata_filter: filter })
          });
          const data = await res.json();
          if (data.error) {
            alert(data.error);
          } else {
            setSearchResults(data.results || []);
          }
        } catch (e) {
          alert("Lỗi tìm kiếm: " + e.message);
        } finally {
          setLoadingSearch(false);
        }
      };

      const handleClearStore = async () => {
        if (!confirm("Bạn có chắc chắn muốn xóa toàn bộ chunks trong store?")) return;
        try {
          await fetch("/api/store/clear", { method: "POST" });
          alert("Đã dọn dẹp Vector Store");
          setSearchResults([]);
          onStoreUpdate();
        } catch (e) {
          alert("Lỗi: " + e.message);
        }
      };

      return (
        <div>
          <div className="tab-title">Quản lý Vector Store</div>
          <div className="tab-description">Thêm tài liệu và thực hiện truy vấn tìm kiếm ngữ nghĩa kèm bộ lọc metadata.</div>

          <div className="vector-layout">
            <div className="glass-card" style={{padding: "20px"}}>
              <h3 style={{marginBottom: "16px", fontSize: "1.1rem", fontWeight: "700"}}>Thêm Document mới</h3>
              
              <div className="form-group">
                <label>Document ID (Tùy chọn):</label>
                <input 
                  type="text" 
                  value={docId} 
                  onChange={(e) => setDocId(e.target.value)}
                  placeholder="Nhập ID (Ví dụ: doc_1)..."
                />
              </div>

              <div className="form-group">
                <label>Nội dung văn bản thủ công (Content):</label>
                <textarea 
                  rows="4" 
                  value={content} 
                  onChange={(e) => setContent(e.target.value)}
                  placeholder="Nhập nội dung cần lưu trữ..."
                />
              </div>

              <div className="form-group">
                <label>Hoặc Upload File (PDF/TXT):</label>
                <div style={{display: "flex", gap: "10px"}}>
                  <input 
                    type="file" 
                    id="file-upload"
                    accept=".pdf,.txt"
                    onChange={(e) => setSelectedFile(e.target.files[0])}
                    style={{padding: "8px", flex: 1}}
                  />
                  <button className="btn btn-primary" onClick={handleFileUpload} disabled={loadingUpload || !selectedFile}>
                    {loadingUpload ? <div className="spinner"></div> : <><Icon name="upload" /> Upload</>}
                  </button>
                </div>
              </div>

              <div className="form-group">
                <label>Metadata Key-Value:</label>
                <div className="meta-inputs">
                  <input 
                    type="text" 
                    value={metaKey} 
                    onChange={(e) => setMetaKey(e.target.value)}
                    placeholder="Key (ví dụ: source)"
                    style={{padding: "8px"}}
                  />
                  <input 
                    type="text" 
                    value={metaVal} 
                    onChange={(e) => setMetaVal(e.target.value)}
                    placeholder="Value (ví dụ: wiki)"
                    style={{padding: "8px"}}
                  />
                  <button className="btn btn-secondary" onClick={addMetadataTag} style={{padding: "8px 12px"}}>
                    +
                  </button>
                </div>

                <div className="metadata-tags-list">
                  {Object.entries(metadata).map(([k, v]) => (
                    <span key={k} className="meta-tag">
                      {k}: {v}
                      <button onClick={() => removeMetadataTag(k)}>
                        <Icon name="x" style={{width: "12px", height: "12px"}} />
                      </button>
                    </span>
                  ))}
                </div>
              </div>

              <button className="btn btn-primary" onClick={handleAddDocument} disabled={loadingAdd} style={{width: "100%"}}>
                {loadingAdd ? <div className="spinner"></div> : <><Icon name="plus" /> Thêm Vào Store</>}
              </button>

              <button className="btn btn-danger" onClick={handleClearStore} style={{width: "100%", marginTop: "12px"}}>
                <Icon name="trash-2" /> Xóa Toàn Bộ Store
              </button>
            </div>

            <div className="glass-card" style={{padding: "20px"}}>
              <h3 style={{marginBottom: "16px", fontSize: "1.1rem", fontWeight: "700"}}>Tìm kiếm ngữ nghĩa (Semantic Search)</h3>
              
              <div className="form-group">
                <label>Câu hỏi / Query tìm kiếm:</label>
                <input 
                  type="text" 
                  value={searchQuery} 
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Nhập nội dung cần tìm..."
                  onKeyDown={(e) => e.key === "Enter" && handleSearch()}
                />
              </div>

              <div className="form-group">
                <label>Bộ lọc Pre-filtering (Metadata Filter - Tùy chọn):</label>
                <div className="meta-inputs">
                  <input 
                    type="text" 
                    value={filterKey} 
                    onChange={(e) => setFilterKey(e.target.value)}
                    placeholder="Key (ví dụ: source)"
                    style={{padding: "8px"}}
                  />
                  <input 
                    type="text" 
                    value={filterVal} 
                    onChange={(e) => setFilterVal(e.target.value)}
                    placeholder="Value (ví dụ: wiki)"
                    style={{padding: "8px"}}
                  />
                </div>
              </div>

              <button className="btn btn-primary" onClick={handleSearch} disabled={loadingSearch} style={{width: "100%", marginBottom: "20px"}}>
                {loadingSearch ? <div className="spinner"></div> : <><Icon name="search" /> Tìm Kiếm</>}
              </button>

              <h3 style={{marginBottom: "12px", fontSize: "1rem", fontWeight: "700"}}>Kết quả truy xuất</h3>

              <div className="search-results-list">
                {searchResults.length === 0 && (
                  <div style={{color: "var(--text-secondary)", fontStyle: "italic", textAlign: "center", padding: "20px"}}>
                    Chưa có kết quả tìm kiếm nào được thực hiện hoặc không tìm thấy tài liệu phù hợp.
                  </div>
                )}
                {searchResults.map((res, idx) => (
                  <div key={idx} className="result-card">
                    <div className="result-header">
                      <span className="result-id">Chunk ID: {res.id}</span>
                      <span className="result-score">Score: {res.score.toFixed(4)}</span>
                    </div>
                    <div className="result-content">{res.content}</div>
                    <div className="result-meta-tags">
                      {Object.entries(res.metadata || {}).map(([k, v]) => (
                        <span key={k} className="meta-pill">{k}: {v}</span>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function RagAgent({ storeSize }) {
      const [question, setQuestion] = useState("Python là gì?");
      const [answer, setAnswer] = useState("");
      const [sources, setSources] = useState([]);
      const [loading, setLoading] = useState(false);

      const handleQueryAgent = async () => {
        if (!question.trim()) return alert("Vui lòng điền câu hỏi");
        setLoading(true);
        try {
          const res = await fetch("/api/agent/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, top_k: 3 })
          });
          const data = await res.json();
          if (data.error) {
            alert(data.error);
          } else {
            setAnswer(data.answer);
            setSources(data.sources || []);
          }
        } catch (e) {
          alert("Lỗi: " + e.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="agent-layout">
          <div>
            <div className="tab-title">Trò Chuyện Với RAG Agent</div>
            <div className="tab-description">
              Agent sẽ tự động truy xuất các thông tin liên quan từ Vector Store và tổng hợp thành câu trả lời ngữ cảnh.
            </div>

            {storeSize === 0 && (
              <div className="glass-card" style={{padding: "16px 20px", borderLeft: "4px solid var(--error)", marginBottom: "20px"}}>
                ⚠️ <strong>Cảnh báo:</strong> Vector Store hiện đang rỗng! Bạn hãy vào tab <strong>Vector Store Manager</strong> để nạp tài liệu trước khi bắt đầu hỏi Agent.
              </div>
            )}
          </div>

          <div className="glass-card agent-chat-card">
            <div className="form-group">
              <label>Nhập câu hỏi của bạn:</label>
              <div className="meta-inputs">
                <input 
                  type="text" 
                  value={question} 
                  onChange={(e) => setQuestion(e.target.value)}
                  placeholder="Ví dụ: Python hoạt động thế nào?..."
                  onKeyDown={(e) => e.key === "Enter" && handleQueryAgent()}
                />
                <button className="btn btn-primary" onClick={handleQueryAgent} disabled={loading}>
                  {loading ? <div className="spinner"></div> : <><Icon name="send" /> Hỏi</>}
                </button>
              </div>
            </div>

            <div>
              <label style={{fontSize: "0.9rem", fontWeight: "600", color: "var(--text-secondary)", display: "block", marginBottom: "8px"}}>
                Câu trả lời sinh ra từ Agent:
              </label>
              <div className="agent-response-area">
                {answer ? (
                  <p style={{lineHeight: "1.6", fontWeight: "500"}}>{answer}</p>
                ) : (
                  <span className="agent-response-placeholder">Nhập câu hỏi và nhấn gửi để nhận câu trả lời...</span>
                )}
              </div>
            </div>

            {sources.length > 0 && (
              <div className="agent-sources-area">
                <div className="agent-sources-title">
                  <Icon name="link" style={{width: "16px", height: "16px"}} /> Ngữ cảnh tham chiếu (Retrieved Sources):
                </div>
                <div className="search-results-list">
                  {sources.map((src, idx) => (
                    <div key={idx} className="result-card" style={{background: "rgba(0,0,0,0.15)", borderColor: "rgba(255,255,255,0.03)"}}>
                      <div className="result-header">
                        <span className="result-id" style={{color: "var(--accent-teal)"}}>Nguồn [{idx + 1}] - Chunk: {src.id}</span>
                        <span className="result-score">Độ liên quan: {src.score.toFixed(4)}</span>
                      </div>
                      <div className="result-content" style={{fontSize: "0.85rem"}}>{src.content}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    function BenchmarkTool() {
      const [questionsText, setQuestionsText] = useState("Python là gì?\nTrí tuệ nhân tạo ảnh hưởng thế nào đến đời sống?\nHọc máy khác gì học sâu?");
      const [loading, setLoading] = useState(false);
      const [results, setResults] = useState(null);

      const runBenchmark = async () => {
        const questions = questionsText.split("\n").map(q => q.trim()).filter(q => q.length > 0);
        if (questions.length === 0) return alert("Vui lòng nhập ít nhất 1 câu hỏi");
        
        setLoading(true);
        setResults(null);
        try {
          const res = await fetch("/api/benchmark", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ questions, top_k: 3 })
          });
          const data = await res.json();
          if (data.error) {
            alert(data.error);
          } else {
            setResults(data);
          }
        } catch (e) {
          alert("Lỗi: " + e.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="agent-layout">
          <div>
            <div className="tab-title">Benchmark RAG System</div>
            <div className="tab-description">
              Đánh giá hiệu năng và độ trễ của quá trình Retrieval và LLM Generation. (Nhập mỗi câu hỏi trên 1 dòng)
            </div>
          </div>

          <div className="glass-card agent-chat-card">
            <div className="form-group">
              <label>Danh sách câu hỏi test:</label>
              <textarea 
                rows="5" 
                value={questionsText} 
                onChange={(e) => setQuestionsText(e.target.value)}
                placeholder="Nhập câu hỏi test, mỗi câu một dòng..."
              />
            </div>

            <button className="btn btn-primary" onClick={runBenchmark} disabled={loading} style={{width: "200px"}}>
              {loading ? <div className="spinner"></div> : <><Icon name="activity" /> Run Benchmark</>}
            </button>
          </div>

          {results && (
            <div className="glass-card agent-chat-card">
              <h3 style={{marginBottom: "16px"}}>Kết Quả Benchmark</h3>
              <div className="dashboard-grid">
                <div className="glass-card dashboard-card card-teal">
                  <div className="dashboard-card-icon"><Icon name="search" /></div>
                  <div className="dashboard-card-info">
                    <h3>{results.metrics.avg_retrieval_time_ms} ms</h3>
                    <p>Avg Retrieval Latency</p>
                  </div>
                </div>
                <div className="glass-card dashboard-card card-purple">
                  <div className="dashboard-card-icon"><Icon name="cpu" /></div>
                  <div className="dashboard-card-info">
                    <h3>{results.metrics.avg_generation_time_ms} ms</h3>
                    <p>Avg LLM Gen Latency</p>
                  </div>
                </div>
                <div className="glass-card dashboard-card card-indigo">
                  <div className="dashboard-card-icon"><Icon name="message-square" /></div>
                  <div className="dashboard-card-info">
                    <h3>{results.metrics.total_questions}</h3>
                    <p>Questions Tested</p>
                  </div>
                </div>
              </div>

              <div style={{marginTop: "20px"}}>
                <h4 style={{marginBottom: "12px", color: "var(--text-secondary)"}}>Chi tiết từng truy vấn:</h4>
                <div className="search-results-list">
                  {results.details.map((d, i) => (
                    <div key={i} className="result-card" style={{display: "flex", justifyContent: "space-between", alignItems: "center"}}>
                      <div style={{fontWeight: "600"}}>{d.question}</div>
                      <div style={{display: "flex", gap: "12px", fontSize: "0.85rem"}}>
                        <span className="meta-pill">Retrieved: {d.retrieved_chunks} chunks</span>
                        <span className="meta-pill" style={{color: "var(--accent-teal)", borderColor: "rgba(20,184,166,0.3)"}}>Retrieval: {d.retrieval_time_ms} ms</span>
                        <span className="meta-pill" style={{color: "var(--accent-purple)", borderColor: "rgba(168,85,247,0.3)"}}>Gen: {d.generation_time_ms} ms</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
  </script>
</body>
</html>
